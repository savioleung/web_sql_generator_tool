                                                onChange={(e) => setSelectConfig(p => ({ ...p, limit: e.target.value }))}
                                                placeholder="例: 50"
                                                className="w-full bg-white border border-slate-300 rounded px-2 py-1 font-mono-code"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[11px] text-slate-500 font-medium block mb-1">スキップ件数 (OFFSET):</label>
                                            <input 
                                                type="number" 
                                                value={selectConfig.offset} 
                                                onChange={(e) => setSelectConfig(p => ({ ...p, offset: e.target.value }))}
                                                placeholder="例: 0"
                                                className="w-full bg-white border border-slate-300 rounded px-2 py-1 font-mono-code"
                                            />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Output Section: Generated SQL Display */}
                    <section className="bg-slate-900 text-slate-100 rounded-xl shadow-xl overflow-hidden border border-slate-800">
                        <div className="border-b border-slate-800 bg-slate-950 px-5 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div className="flex items-center space-x-2">
                                <span className="flex items-center justify-center bg-indigo-500 text-white font-bold text-xs rounded-md w-6 h-6">4</span>
                                <h2 className="text-base font-bold text-white tracking-wide">生成された SQL スクリプト</h2>
                            </div>

                            {/* SQL Tabs */}
                            <div className="flex items-center bg-slate-900 border border-slate-800 p-1 rounded-lg overflow-x-auto">
                                {[
                                    { id: 'all', label: 'すべて出力' },
                                    { id: 'create', label: 'CREATE TABLE' },
                                    { id: 'index', label: 'CREATE INDEX' },
                                    { id: 'insert', label: 'INSERT文' },
                                    { id: 'update', label: 'UPDATE文' },
                                    { id: 'select', label: 'SELECT文 (表C)' }
                                ].map(tab => (
                                    <button 
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)} 
                                        className={`px-3 py-1 text-xs rounded-md font-semibold transition whitespace-nowrap ${activeTab === tab.id ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>

                            <div className="flex items-center space-x-2">
                                <button onClick={handleCopy} className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold px-3 py-1.5 rounded-lg transition">
                                    📋 コピー
                                </button>
                                <button onClick={handleDownload} className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition shadow">
                                    💾 .sql 保存
                                </button>
                            </div>
                        </div>

                        <div className="relative">
                            <textarea 
                                readOnly 
                                value={generatedSQL} 
                                className="w-full h-80 bg-slate-950 text-emerald-400 font-mono-code text-xs p-5 focus:outline-none resize-y leading-relaxed"
                            />
                        </div>
                    </section>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
